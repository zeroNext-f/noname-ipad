name: build-ipa

# 在 GitHub 提供的 macOS runner 上构建「未签名 IPA」。
# 你不需要 Mac：产物下载到 Windows 后，用 Sideloadly + Apple ID 签名安装到 iPad。
#
# 设计要点（都是为 CI 稳定性做的）：
#   1. 用 `xcodebuild -target` 而不是 `-scheme`：不依赖磁盘上的 scheme 文件，
#      也从根上避开 "does not contain a scheme named ..." 这类失败。
#   2. 每一步都用 tee 落盘日志；失败时把错误以 ::error:: 抛出成 annotation，
#      annotation 无需登录即可通过 GitHub API 读取，便于远程排障。
#   3. 产物用 find 定位，不硬编码路径。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'shim/**'
      - 'cordova/**'
      - 'tools/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: 同步 Web 壳到 iOS 工程
        run: node tools/sync-web.js

      - name: 安装 XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log
          echo "---- 生成结果 ----" | tee -a xcodegen.log
          ls -la | tee -a xcodegen.log
          xcodebuild -list -project NonameDecade.xcodeproj 2>&1 | tee -a xcodegen.log

      - name: 构建（不签名）
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project NonameDecade.xcodeproj \
            -target NonameDecade \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$PWD/build/sym" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      # 把编译/生成错误以 annotation 抛出（annotation 无需登录即可读）
      - name: 失败时暴露错误明细
        if: failure()
        working-directory: ios
        run: |
          echo "=========== 目录里的日志文件 ==========="
          ls -la *.log 2>/dev/null || echo "(没有 .log 文件)"

          for f in xcodegen.log build.log; do
            [ -f "$f" ] || continue
            echo ""
            echo "=========== $f 末尾 100 行 ==========="
            tail -100 "$f" || true
            echo ""
            echo "=========== $f 中的错误行 ==========="
            grep -nE "error:|fatal error:|xcodebuild: error|does not contain a scheme|The following build commands failed|Command .* failed|Undefined symbol|Unknown attribute|does not exist|Unexpected" "$f" | head -25 || true
            echo ""
            echo "=========== 抛成注解 ==========="
            grep -nE "error:|fatal error:|xcodebuild: error|does not contain a scheme|The following build commands failed|Unexpected|does not exist" "$f" \
              | head -15 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | head -c 900)"
                done
          done
          echo "::error::构建失败，详见上方日志（run page 可下载完整日志）"

      - name: 定位产物
        if: success()
        working-directory: ios
        run: |
          APP=$(find . -name "NonameDecade.app" -type d | head -1)
          echo "== 搜索到 =="
          find . -name "*.app" -type d || true
          echo "解析到：$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: 校验产物
        if: success()
        working-directory: ios
        run: |
          APP="${{ env.APP }}"
          test -n "$APP" || { echo "::error::没有找到 NonameDecade.app"; exit 1; }
          test -d "$APP" || { echo "::error::app 路径无效: $APP"; exit 1; }
          echo "== 关键文件 =="
          ls -la "$APP"
          test -f "$APP/Web/__shim.js" || { echo "::error::缺少 Web/__shim.js"; exit 1; }
          test -f "$APP/Web/__native.js" || { echo "::error::缺少 Web/__native.js"; exit 1; }
          test -f "$APP/Web/index.html" || { echo "::error::缺少 Web/index.html"; exit 1; }
          echo "== 架构 =="
          lipo -info "$APP/NonameDecade"
          echo "== 体积 =="
          du -sh "$APP"

      - name: 打包未签名 IPA
        if: success()
        working-directory: ios
        run: |
          rm -rf Payload NonameDecade-unsigned.ipa
          mkdir -p Payload
          cp -R "${{ env.APP }}" Payload/
          zip -qry NonameDecade-unsigned.ipa Payload
          ls -lh NonameDecade-unsigned.ipa
          shasum -a 256 NonameDecade-unsigned.ipa | tee NonameDecade-unsigned.ipa.sha256

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NonameDecade-unsigned-ipa
          path: |
            ios/NonameDecade-unsigned.ipa
            ios/NonameDecade-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 失败时保留构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/xcodegen.log
            ios/build.log
          if-no-files-found: ignore
