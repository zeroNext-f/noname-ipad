name: build-ipa

# 在 GitHub 提供的 macOS runner 上构建「未签名 IPA」。
# 你不需要 Mac：产物下载到 Windows 后，用 Sideloadly + Apple ID 签名安装到 iPad。
#
# 已踩过的坑（都在这份配置里修掉了）：
#   1. 新版 XcodeGen 生成 objectVersion = 77（Xcode 16 格式），
#      而 macos-14 的 Xcode 15.4 读不了 → "xcodebuild: error: Unable to read project"。
#      对策：① 改用 macos-15（Xcode 16）；② 仍按 Xcode 版本自动降级 objectVersion 兜底。
#   2. 不用 `-scheme`，改用 `xcodebuild -target`，避开 scheme 文件相关问题。
#   3. 所有输出落盘 + 失败时把错误以 ::error:: 抛成 annotation，
#      并把日志提交回仓库，便于无需登录地远程排障。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'shim/**'
      - 'cordova/**'
      - 'tools/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: 同步 Web 壳到 iOS 工程
        run: node tools/sync-web.js

      - name: 安装 XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

          # ---- objectVersion 兼容处理 ----
          # 新版 XcodeGen 默认写 77（Xcode 16 格式）。若本机 Xcode 主版本 < 16，
          # 就降级为 56，否则 xcodebuild 会报 "Unable to read project"。
          PBX="NonameDecade.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            XCODE_MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
            OBJVER=$(grep -m1 -oE 'objectVersion = [0-9]+' "$PBX" | grep -oE '[0-9]+' || echo "?")
            echo "本机 Xcode 主版本 = $XCODE_MAJOR ；生成工程的 objectVersion = $OBJVER" | tee -a xcodegen.log
            if [ "$XCODE_MAJOR" -lt 16 ] 2>/dev/null && [ "$OBJVER" != "?" ] && [ "$OBJVER" -gt 56 ]; then
              sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/' "$PBX"
              echo "已把 objectVersion 降级为 56（适配 Xcode 15）" | tee -a xcodegen.log
            fi
            echo "--- project.pbxproj 头部 ---" | tee -a xcodegen.log
            head -12 "$PBX" | tee -a xcodegen.log
          else
            echo "!! 没有生成 project.pbxproj" | tee -a xcodegen.log
          fi

          echo "--- 目录 ---" | tee -a xcodegen.log
          ls -la | tee -a xcodegen.log
          echo "--- xcodebuild -list ---" | tee -a xcodegen.log
          xcodebuild -list -project NonameDecade.xcodeproj 2>&1 | tee -a xcodegen.log

      - name: 构建（不签名）
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project NonameDecade.xcodeproj \
            -target NonameDecade \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$PWD/build/sym" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      # 把编译/生成错误以 annotation 抛出（annotation 无需登录即可读）
      - name: 失败时暴露错误明细
        if: failure()
        working-directory: ios
        run: |
          echo "=========== 目录里的日志文件 ==========="
          ls -la *.log 2>/dev/null || echo "(没有 .log 文件)"

          for f in xcodegen.log build.log; do
            [ -f "$f" ] || continue
            echo ""
            echo "=========== $f 末尾 100 行 ==========="
            tail -100 "$f" || true
            echo ""
            echo "=========== $f 中的错误行 ==========="
            grep -nE "error:|fatal error:|xcodebuild: error|Unable to read project|does not contain a scheme|The following build commands failed|Command .* failed|Undefined symbol|Unknown attribute|does not exist|Unexpected" "$f" | head -25 || true
            echo ""
            echo "=========== 抛成注解 ==========="
            grep -nE "error:|fatal error:|xcodebuild: error|Unable to read project|does not contain a scheme|The following build commands failed|Unexpected|does not exist" "$f" \
              | head -12 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r' | head -c 900)"
                done
          done

      - name: 定位产物
        if: success()
        working-directory: ios
        run: |
          APP=$(find . -name "NonameDecade.app" -type d | head -1)
          echo "== 搜索到 =="
          find . -name "*.app" -type d || true
          echo "解析到：$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: 校验产物
        if: success()
        working-directory: ios
        run: |
          APP="${{ env.APP }}"
          test -n "$APP" || { echo "::error::没有找到 NonameDecade.app"; exit 1; }
          test -d "$APP" || { echo "::error::app 路径无效: $APP"; exit 1; }
          echo "== 关键文件 =="
          ls -la "$APP"
          test -f "$APP/Web/__shim.js" || { echo "::error::缺少 Web/__shim.js"; exit 1; }
          test -f "$APP/Web/__native.js" || { echo "::error::缺少 Web/__native.js"; exit 1; }
          test -f "$APP/Web/index.html" || { echo "::error::缺少 Web/index.html"; exit 1; }
          echo "== 架构 =="
          lipo -info "$APP/NonameDecade"
          echo "== 体积 =="
          du -sh "$APP"

      - name: 打包未签名 IPA
        if: success()
        working-directory: ios
        run: |
          rm -rf Payload NonameDecade-unsigned.ipa
          mkdir -p Payload
          cp -R "${{ env.APP }}" Payload/
          zip -qry NonameDecade-unsigned.ipa Payload
          ls -lh NonameDecade-unsigned.ipa
          shasum -a 256 NonameDecade-unsigned.ipa | tee NonameDecade-unsigned.ipa.sha256

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NonameDecade-unsigned-ipa
          path: |
            ios/NonameDecade-unsigned.ipa
            ios/NonameDecade-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      # 把日志提交回仓库：这样我不需要任何登录就能读到完整日志
      - name: 失败时把日志提交回仓库
        if: failure()
        run: |
          mkdir -p ci-logs
          cp ios/xcodegen.log ci-logs/ 2>/dev/null || true
          cp ios/build.log    ci-logs/ 2>/dev/null || true
          { sw_vers; xcodebuild -version; } > ci-logs/toolchain.txt 2>&1 || true
          ls -la ios > ci-logs/ios-dir.txt 2>&1 || true
          echo "${{ github.sha }}" > ci-logs/sha.txt
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: build logs for ${{ github.sha }} [skip ci]" || true
          git push || true
