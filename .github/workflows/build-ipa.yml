name: build-ipa

# 在 GitHub 提供的 macOS runner 上构建「未签名 IPA」。
# 你不需要 Mac：产物下载到 Windows 后，用 Sideloadly + Apple ID 签名安装到 iPad。
#
# 用法：推到 GitHub 后，在 Actions 页手动触发（workflow_dispatch），
#       或 push 到 main 自动构建。构建完成后在 Artifacts 下载 NonameDecade-unsigned-ipa。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'shim/**'
      - 'cordova/**'
      - 'tools/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: 同步 Web 壳到 iOS 工程
        run: node tools/sync-web.js

      - name: 安装 XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 构建（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project NonameDecade.xcodeproj \
            -scheme NonameDecade \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 校验产物
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/NonameDecade.app"
          test -d "$APP" || { echo "未生成 .app"; exit 1; }
          echo "== 关键文件 =="
          ls -la "$APP" | head -40
          test -f "$APP/Web/__shim.js" || { echo "缺少 Web/__shim.js"; exit 1; }
          test -f "$APP/Web/__native.js" || { echo "缺少 Web/__native.js"; exit 1; }
          test -f "$APP/Web/index.html" || { echo "缺少 Web/index.html"; exit 1; }
          test -f "$APP/LaunchScreen.storyboardc/Info.plist" || echo "警告：未找到 LaunchScreen.storyboardc"
          echo "== 架构 =="
          lipo -info "$APP/NonameDecade"
          echo "== 体积 =="
          du -sh "$APP"

      - name: 打包未签名 IPA
        working-directory: ios
        run: |
          rm -rf Payload NonameDecade-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NonameDecade.app Payload/
          zip -qry NonameDecade-unsigned.ipa Payload
          ls -lh NonameDecade-unsigned.ipa
          shasum -a 256 NonameDecade-unsigned.ipa | tee NonameDecade-unsigned.ipa.sha256

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: NonameDecade-unsigned-ipa
          path: |
            ios/NonameDecade-unsigned.ipa
            ios/NonameDecade-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 构建失败时收集日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/xcodebuild/*.log
            ios/build/Logs/**
          if-no-files-found: ignore
