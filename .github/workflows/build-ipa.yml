name: build-ipa

# 在 GitHub 提供的 macOS runner 上构建「未签名 IPA」。
# 你不需要 Mac：产物下载到 Windows 后，用 Sideloadly + Apple ID 签名安装到 iPad。
#
# 用法：推到 GitHub 后，在 Actions 页手动触发（workflow_dispatch），
#       或 push 到 main 自动构建。构建完成后在 Artifacts 下载 NonameDecade-unsigned-ipa。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'shim/**'
      - 'cordova/**'
      - 'tools/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: 同步 Web 壳到 iOS 工程
        run: node tools/sync-web.js

      - name: 安装 XcodeGen
        run: |
          brew update --quiet || true
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          xcodegen generate
          echo "---- 工程内容 ----"
          ls -la
          echo "---- 可用的 scheme / target ----"
          xcodebuild -list -project NonameDecade.xcodeproj

      - name: 构建（不签名）
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project NonameDecade.xcodeproj \
            -scheme NonameDecade \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      # 关键排障步骤：把编译错误以 annotation 形式抛出来。
      # annotation 无需登录即可通过 GitHub API 读取，便于远程定位问题。
      - name: 失败时暴露错误明细
        if: failure()
        working-directory: ios
        run: |
          echo "================= 关键错误行 ================="
          if [ -f build.log ]; then
            grep -nE "error:|fatal error:|xcodebuild: error|does not contain a scheme|The following build commands failed|Command .* failed|Undefined symbol|not found" build.log | head -40 || true
            echo "================= build.log 末尾 100 行 ================="
            tail -100 build.log || true
            echo "================= 抛成注解 ================="
            grep -nE "error:|fatal error:|xcodebuild: error|does not contain a scheme|The following build commands failed" build.log \
              | head -20 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | tr -d '\r' | head -c 900)
                  echo "::error::${safe}"
                done
          else
            echo "::error::没有生成 build.log —— 构建根本没开始，可能是 scheme 或工程生成有问题"
          fi

      - name: 定位产物
        if: success()
        working-directory: ios
        run: |
          echo "== 搜索 .app =="
          find build -name "*.app" -maxdepth 6 -type d || true
          APP=$(find build -name "NonameDecade.app" -type d | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "解析到：$APP"

      - name: 校验产物
        if: success()
        working-directory: ios
        run: |
          APP="${{ env.APP }}"
          test -n "$APP" || { echo "::error::没有找到 NonameDecade.app"; exit 1; }
          test -d "$APP" || { echo "::error::app 路径无效: $APP"; exit 1; }
          echo "== 关键文件 =="
          ls -la "$APP"
          test -f "$APP/Web/__shim.js" || { echo "::error::缺少 Web/__shim.js"; exit 1; }
          test -f "$APP/Web/__native.js" || { echo "::error::缺少 Web/__native.js"; exit 1; }
          test -f "$APP/Web/index.html" || { echo "::error::缺少 Web/index.html"; exit 1; }
          echo "== 架构 =="
          lipo -info "$APP/NonameDecade"
          echo "== 体积 =="
          du -sh "$APP"

      - name: 打包未签名 IPA
        if: success()
        working-directory: ios
        run: |
          rm -rf Payload NonameDecade-unsigned.ipa
          mkdir -p Payload
          cp -R "${{ env.APP }}" Payload/
          zip -qry NonameDecade-unsigned.ipa Payload
          ls -lh NonameDecade-unsigned.ipa
          shasum -a 256 NonameDecade-unsigned.ipa | tee NonameDecade-unsigned.ipa.sha256

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NonameDecade-unsigned-ipa
          path: |
            ios/NonameDecade-unsigned.ipa
            ios/NonameDecade-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 失败时保留构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build.log
            ios/build/Logs/**
          if-no-files-found: ignore
