name: NonameDecade
options:
  bundleIdPrefix: online.nonamekill
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  NonameDecade:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    # 注意：这里刻意保持精简。
    # 不声明 schemes —— CI 用 `xcodebuild -target` 直接编 target，
    # 不依赖磁盘上的 scheme 文件；在 Mac 上用 Xcode 打开时会自动生成 scheme。
    sources:
      - path: NonameDecade/Sources
      - path: NonameDecade/Assets.xcassets
      - path: NonameDecade/Web
        type: folder
        buildPhase: resources

    info:
      path: NonameDecade/Info.plist
      properties:
        CFBundleDisplayName: "无名杀十周年版"
        CFBundleName: NonameDecade
        CFBundleShortVersionString: "1.12.7"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: true
        # plist 形式的启动屏（iOS 14+），不依赖 storyboard。
        # 必须是非空字典，否则 XcodeGen 生成工程可能出错。
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        # iOS 14+ 第三方 App 访问局域网设备（如电脑上的 10.x / 192.168.x 地址）
        # 必须声明这个键，系统才会弹窗请求「本地网络」权限。
        # 缺少它会导致所有局域网连接被静默拒绝，报 "The Internet connection appears to be offline"。
        NSLocalNetworkUsageDescription: "需要访问本地网络，以便从同一 Wi-Fi 下的电脑导入游戏数据（约 2.5 GB）。"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.nonamekill.decade
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
